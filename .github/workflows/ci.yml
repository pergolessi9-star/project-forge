name: PROJECT FORGE CI
on:
  push:
    branches: [main, foundation-v0.1]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Create definitive source archive
        if: always()
        run: zip -qr PROJECT-FORGE-Discovery-Command-Center-v0.1.1.zip . -x '.git/*' 'node_modules/*' '.next/*'
      - name: Upload definitive source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-FORGE-Discovery-Command-Center-v0.1.1
          path: PROJECT-FORGE-Discovery-Command-Center-v0.1.1.zip
          if-no-files-found: error

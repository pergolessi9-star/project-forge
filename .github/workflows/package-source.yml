name: Package definitive source
on:
  push:
    branches: [foundation-v0.1]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          rm -rf .git
          zip -qr ../PROJECT-FORGE-Discovery-Command-Center-v0.1.1.zip . -x 'node_modules/*' '.next/*'
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-FORGE-Discovery-Command-Center-v0.1.1
          path: ../PROJECT-FORGE-Discovery-Command-Center-v0.1.1.zip
          if-no-files-found: error
